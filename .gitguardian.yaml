# false-positive measurement). Scoped to the files, not to tests/, so a real credential pasted into any other test is still flagged.
version: 2
secret:
  ignored_paths:
    - tests/secret-leaks.vitest.ts
    - tests/fragment-backstop.vitest.ts
    - scripts/measure-fragment-fp.ts
