<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Transcripts are untrusted content. Scripts load only from this origin, data only
      from GitHub gists and the sources in viewer.config.json, and remote images are
      blocked (no tracking pixels). The policy is filled in by vite.config.ts.
    -->
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Shared session · overshare</title>
    <!-- A copy of site/logo.svg (a test keeps them the same). The standalone export inlines it as a data: URI. -->
    <link rel="icon" href="./src/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- The loading log's first line, shown before the script loads; boot.ts adds the rest. -->
    <main id="app"><div class="status loading" role="status"><ol class="boot"><li><span class="mark"></span>loading viewer</li></ol></div></main>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <!-- In the page from the start: screen readers only announce changes to a live region they already know. -->
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
