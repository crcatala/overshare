<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Transcripts are untrusted content. Scripts load only from this origin, data only
      from GitHub gists and the sources in viewer.config.json, and remote images are
      blocked (no tracking pixels). The policy is filled in by vite.config.ts.
    -->
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Shared session · overshare</title>
  </head>
  <body>
    <main id="app"><p class="status">Loading session…</p></main>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <!-- In the page from the start: screen readers only announce changes to a live region they already know. -->
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
